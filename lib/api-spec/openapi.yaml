openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: The Social Media Room API - private dual-user digital sanctuary
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: spaces
    description: Sidebar space groups
  - name: tags
    description: Channel tags within spaces
  - name: letters
    description: Long-form letter correspondence
  - name: messages
    description: Chat messages
  - name: upload
    description: File attachment uploads

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /spaces:
    get:
      operationId: getSpaces
      tags: [spaces]
      summary: List all spaces with their tags
      responses:
        "200":
          description: List of spaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Space"
    post:
      operationId: createSpace
      tags: [spaces]
      summary: Create a new space
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpaceInput"
      responses:
        "201":
          description: Created space
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Space"

  /spaces/{spaceId}:
    patch:
      operationId: updateSpace
      tags: [spaces]
      summary: Rename or reorder a space
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpaceUpdateInput"
      responses:
        "200":
          description: Updated space
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Space"
    delete:
      operationId: deleteSpace
      tags: [spaces]
      summary: Delete a space
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /tags:
    get:
      operationId: getTags
      tags: [tags]
      summary: List all tags
      responses:
        "200":
          description: List of tags with unread counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tag"
    post:
      operationId: createTag
      tags: [tags]
      summary: Create a new tag/channel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagInput"
      responses:
        "201":
          description: Created tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"

  /tags/{tagId}:
    patch:
      operationId: updateTag
      tags: [tags]
      summary: Rename or reorder a tag
      parameters:
        - name: tagId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagUpdateInput"
      responses:
        "200":
          description: Updated tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
    delete:
      operationId: deleteTag
      tags: [tags]
      summary: Delete a tag (admin only)
      parameters:
        - name: tagId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /unread-counts:
    get:
      operationId: getUnreadCounts
      tags: [tags]
      summary: Get unread counts per tag for the current user
      responses:
        "200":
          description: Unread counts map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCounts"

  /letters:
    get:
      operationId: getLetters
      tags: [letters]
      summary: List letters for a given tag
      parameters:
        - name: tagId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of letters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LetterSummary"
    post:
      operationId: createLetter
      tags: [letters]
      summary: Create a new letter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LetterInput"
      responses:
        "201":
          description: Created letter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Letter"

  /letters/{letterId}:
    get:
      operationId: getLetter
      tags: [letters]
      summary: Get a specific letter (marks as read)
      parameters:
        - name: letterId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Letter with full content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Letter"
    delete:
      operationId: deleteLetter
      tags: [letters]
      summary: Delete a letter
      parameters:
        - name: letterId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /letters/{letterId}/tags:
    patch:
      operationId: updateLetterTags
      tags: [letters]
      summary: Reassign a letter to different postbox channel(s)
      parameters:
        - name: letterId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tagIds]
              properties:
                tagIds:
                  type: array
                  items:
                    type: integer
      responses:
        "200":
          description: Updated tag assignments
          content:
            application/json:
              schema:
                type: object
                properties:
                  letterId:
                    type: integer
                  tagIds:
                    type: array
                    items:
                      type: integer

  /letters/{letterId}/react:
    post:
      operationId: reactToLetter
      tags: [letters]
      summary: Add or remove an emoji reaction to a letter
      parameters:
        - name: letterId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReactionInput"
      responses:
        "200":
          description: Updated letter reactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Letter"

  /messages:
    get:
      operationId: getMessages
      tags: [messages]
      summary: Get messages for a chat tag, with cursor pagination
      parameters:
        - name: tagId
          in: query
          required: true
          schema:
            type: integer
        - name: before
          in: query
          required: false
          schema:
            type: integer
          description: Cursor - get messages before this message ID
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a chat message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Sent message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /messages/clear:
    delete:
      operationId: clearChatHistory
      tags: [messages]
      summary: Delete all messages in a channel (admin only)
      parameters:
        - name: tagId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Cleared

  /messages/{messageId}:
    patch:
      operationId: updateMessage
      tags: [messages]
      summary: Edit a message's content
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageUpdateInput"
      responses:
        "200":
          description: Updated message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
    delete:
      operationId: deleteMessage
      tags: [messages]
      summary: Delete a message
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /messages/{messageId}/view:
    post:
      operationId: viewOncePhoto
      tags: [messages]
      summary: Open a view-once photo (recipient only). Returns raw image bytes and deletes the file from the server. Only one request can claim the view; concurrent requests receive 410.
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Raw image bytes. Served exactly once, then deleted server-side.
          content:
            image/*:
              schema:
                type: string
                format: binary
        "403":
          description: Sender cannot view their own view-once photo
        "410":
          description: Photo already viewed, expired, or no longer available

  /messages/{messageId}/react:
    post:
      operationId: reactToMessage
      tags: [messages]
      summary: Toggle an emoji reaction on a message
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReactionInput"
      responses:
        "200":
          description: Updated reactions for the message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReactionToggleResult"

  /letters/{letterId}/comments:
    get:
      operationId: getLetterComments
      tags: [letters]
      summary: Get all comments for a letter
      parameters:
        - name: letterId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LetterComment"
    post:
      operationId: addLetterComment
      tags: [letters]
      summary: Add a comment to a letter
      parameters:
        - name: letterId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LetterCommentInput"
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LetterComment"

  /notifications:
    get:
      operationId: getNotifications
      tags: [health]
      summary: Get counts of new activity on your content since last seen
      responses:
        "200":
          description: Notification summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSummary"

  /notifications/seen:
    post:
      operationId: markNotificationsSeen
      tags: [health]
      summary: Mark all notifications as seen (updates the activity cursor)
      responses:
        "204":
          description: Cursor updated

  /me:
    get:
      operationId: getMe
      tags: [health]
      summary: Get current authenticated user info
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /profile:
    get:
      operationId: getProfile
      tags: [health]
      summary: Get the current user's profile (creates one if new)
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileRecord"
    patch:
      operationId: updateProfile
      tags: [health]
      summary: Set display name and mark profile complete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileRecord"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    UserProfile:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          description: System login credential — never shown in chat UI
        displayName:
          type: string
          description: Preferred display name shown everywhere in the UI
        isProfileComplete:
          type: boolean
          description: False until the user completes the onboarding form
        avatarUrl:
          type: ["string", "null"]
        isAdmin:
          type: boolean
      required:
        - id
        - email
        - displayName
        - isProfileComplete
        - isAdmin

    ProfileRecord:
      type: object
      properties:
        userId:
          type: string
        displayName:
          type: string
        isProfileComplete:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - userId
        - displayName
        - isProfileComplete
        - createdAt
        - updatedAt

    ProfileUpdateInput:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 40
      required:
        - displayName

    Space:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        sortOrder:
          type: integer
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
      required:
        - id
        - name
        - sortOrder
        - tags

    SpaceInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        sortOrder:
          type: integer
      required:
        - name

    SpaceUpdateInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        sortOrder:
          type: integer

    Tag:
      type: object
      properties:
        id:
          type: integer
        spaceId:
          type: integer
        name:
          type: string
        slug:
          type: string
        type:
          type: string
          enum: [postbox, chat]
        icon:
          type: ["string", "null"]
        sortOrder:
          type: integer
        unreadCount:
          type: integer
        isAdminOnly:
          type: boolean
      required:
        - id
        - spaceId
        - name
        - slug
        - type
        - sortOrder
        - unreadCount
        - isAdminOnly

    TagInput:
      type: object
      properties:
        spaceId:
          type: integer
        name:
          type: string
          minLength: 1
        type:
          type: string
          enum: [postbox, chat]
        icon:
          type: string
        sortOrder:
          type: integer
      required:
        - spaceId
        - name
        - type

    TagUpdateInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        icon:
          type: string
        sortOrder:
          type: integer
        spaceId:
          type: integer
        isAdminOnly:
          type: boolean

    UnreadCounts:
      type: object
      properties:
        counts:
          type: object
          additionalProperties:
            type: integer
      required:
        - counts

    LetterSummary:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        tagIds:
          type: array
          items:
            type: integer
        authorId:
          type: string
        authorName:
          type: string
        createdAt:
          type: string
          format: date-time
        isRead:
          type: boolean
        hasAttachments:
          type: boolean
        excerpt:
          type: ["string", "null"]
      required:
        - id
        - title
        - tagIds
        - authorId
        - authorName
        - createdAt
        - isRead
        - hasAttachments

    Letter:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        content:
          type: object
          description: Editor.js-style block content JSON
          additionalProperties: true
        tagIds:
          type: array
          items:
            type: integer
        authorId:
          type: string
        authorName:
          type: string
        createdAt:
          type: string
          format: date-time
        isRead:
          type: boolean
        reactions:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
      required:
        - id
        - title
        - content
        - tagIds
        - authorId
        - authorName
        - createdAt
        - isRead
        - reactions
        - attachments

    LetterInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        content:
          type: object
          additionalProperties: true
        tagIds:
          type: array
          items:
            type: integer
          minItems: 1
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/AttachmentInput"
      required:
        - title
        - content
        - tagIds

    Attachment:
      type: object
      properties:
        id:
          type: integer
        url:
          type: string
        filename:
          type: string
        mimeType:
          type: string
        size:
          type: integer
      required:
        - id
        - url
        - filename
        - mimeType
        - size

    AttachmentInput:
      type: object
      properties:
        url:
          type: string
        filename:
          type: string
        mimeType:
          type: string
        size:
          type: integer
      required:
        - url
        - filename
        - mimeType
        - size

    ReactionInput:
      type: object
      properties:
        emoji:
          type: string
      required:
        - emoji

    MessageReplyPreview:
      type: object
      description: Snapshot of the parent message embedded in a quote-reply
      properties:
        id:
          type: integer
        senderId:
          type: string
        senderDisplayName:
          type: string
        content:
          type: string
      required:
        - id
        - senderId
        - senderDisplayName
        - content

    MessageViewOnce:
      type: object
      description: View-once photo metadata. Present only when the message contains a view-once photo.
      properties:
        status:
          type: string
          enum: [unseen, opened, expired]
          description: Current lifecycle state of the view-once photo
        expiresAt:
          type: ["string", "null"]
          format: date-time
          description: When the photo expires (24 h after sending). Null if no expiry set.
        viewedAt:
          type: ["string", "null"]
          format: date-time
          description: When the recipient opened the photo. Null until viewed.
        isSender:
          type: boolean
          description: True when the requesting user is the one who sent the photo
      required:
        - status
        - isSender

    Message:
      type: object
      properties:
        id:
          type: integer
        tagId:
          type: integer
        senderId:
          type: string
          description: Unique Clerk user ID of the sender
        senderDisplayName:
          type: string
          description: Preferred display name shown in the chat UI for both parties
        senderLoginName:
          type: ["string", "null"]
          description: System login email stored for auditing — never rendered in the UI
        content:
          type: string
        createdAt:
          type: string
          format: date-time
          description: Server-authoritative UTC timestamp
        seenByPartner:
          type: boolean
          description: True once the other user has loaded messages up to and including this one. Once true, the sender can no longer delete it.
        reactions:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Map of emoji to list of user IDs who reacted
        replyTo:
          $ref: "#/components/schemas/MessageReplyPreview"
          description: Snapshot of the parent message when this is a quote-reply. Null if not a reply.
          nullable: true
        viewOnce:
          $ref: "#/components/schemas/MessageViewOnce"
          description: View-once photo metadata. Null for regular text messages.
          nullable: true
      required:
        - id
        - tagId
        - senderId
        - senderDisplayName
        - content
        - createdAt
        - seenByPartner
        - reactions

    MessageInput:
      type: object
      properties:
        tagId:
          type: integer
        content:
          type: string
          description: Message text. Optional when viewOnceUrl is provided.
        replyToId:
          type: integer
          description: ID of the message being quoted/replied to
          nullable: true
        viewOnceUrl:
          type: string
          description: Server-upload URL of an image to send as a view-once photo. Must match /api/uploads/<filename>.<image-ext>. Mutually exclusive with a content-only message.
          nullable: true
      required:
        - tagId

    MessageUpdateInput:
      type: object
      properties:
        content:
          type: string
          minLength: 1
      required:
        - content

    ReactionToggleResult:
      type: object
      properties:
        reactions:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
        - reactions

    LetterComment:
      type: object
      properties:
        id:
          type: integer
        letterId:
          type: integer
        userId:
          type: string
        authorName:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - letterId
        - userId
        - authorName
        - content
        - createdAt

    LetterCommentInput:
      type: object
      properties:
        content:
          type: string
          minLength: 1
      required:
        - content

    NotificationSummary:
      type: object
      properties:
        newMessages:
          type: integer
          description: Count of new chat messages from the partner since last seen
        newLetters:
          type: integer
          description: Count of new letters from the partner since last seen
        newMessageReactions:
          type: integer
          description: Count of new emoji reactions on your messages since last seen
        newLetterComments:
          type: integer
          description: Count of new comments on your letters since last seen
        totalLetterReactions:
          type: integer
          description: Total emoji reactions on your letters from the partner (all time)
        since:
          type: string
          format: date-time
          description: The timestamp used as the "since" cursor
      required:
        - newMessages
        - newLetters
        - newMessageReactions
        - newLetterComments
        - totalLetterReactions
        - since

    UploadResult:
      type: object
      properties:
        url:
          type: string
        filename:
          type: string
        mimeType:
          type: string
        size:
          type: integer
      required:
        - url
        - filename
        - mimeType
        - size
